[project]
name = "slopmachine-embedding-laion-clap-text-int8"
version = "0.1.0-alpha.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "onnxruntime>=1.29.0",
    "slopmachine-embedding>=0.1.0a1",
    "tokenizers>=0.23.2",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["slopmachine*"]

[tool.setuptools.package-data]
"slopmachine.embedding.laion_clap_text_int8" = ["model.onnx", "tokenizer.json"]

[tool.uv]
exclude-newer-package = { slopmachine-embedding = false }

[[tool.uv.index]]
name = "slopmachine"
url = "https://m1nt-s0da.github.io/slopmachine-pypi/"
